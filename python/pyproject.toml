[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anexus-sdk"
version = "0.2.0"
description = "Anexus AI Identity SDK — universal identity verification for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Anexus"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
keywords = ["ai", "identity", "verification", "authentication", "agent"]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "starlette>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Marsssssssssssdsss/nexus6-sdk"
Documentation = "https://nexus-7xp6n.ondigitalocean.app"
Source = "https://github.com/Marsssssssssssdsss/nexus6-sdk"

[tool.setuptools.packages.find]
include = ["anexus_sdk*"]