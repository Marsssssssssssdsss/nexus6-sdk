[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anexus-sdk"
version = "0.3.0"
description = "Anexus Auth Codes SDK — one-time verification codes for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Anexus"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
keywords = ["ai", "auth-codes", "verification", "authentication", "agent"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/Marsssssssssssdsss/nexus6-sdk"
Documentation = "https://github.com/Marsssssssssssdsss/nexus6-sdk"
Source = "https://github.com/Marsssssssssssdsss/nexus6-sdk"

[tool.setuptools.packages.find]
include = ["anexus_sdk*"]